name: Deploy Telemetry (Docker to GHCR)

on:
  push:
    branches:
      - produccion
    paths:
      - 'telemetry/**'
      - 'infra/arm-bogota/**'
      - '.github/workflows/deploy-telemetry.yml'

# Permissions required to publish to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate lowercase tag name
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-telemetry

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Context in root to access monorepo packages
          file: ./telemetry/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-arm-bogota:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Connect to Tailscale VPN to access the regional ARM-Bogota instance internally
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Deploy using SSH over private Tailscale IP
      - name: Execute Pull and Restart in ARM Bogota
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ARM_BOGOTA_TAILSCALE_IP }}" >> ~/.ssh/known_hosts
          
          ssh ${{ secrets.SSH_USER }}@${{ secrets.ARM_BOGOTA_TAILSCALE_IP }} << 'EOF'
            mkdir -p /opt/bienestar
            cd /opt/bienestar
            
            # Authenticate Docker to pull private GHCR images
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new image and restart the telemetry service without shutting down database/redis
            # (Matches safe update pattern to protect RAM on OCI instances)
            if [ -f "docker-compose.yml" ]; then
              sudo docker compose pull telemetry
              sudo docker compose up -d --no-deps telemetry
              sudo docker image prune -f
            else
              echo "[WARN] docker-compose.yml not found in /opt/bienestar. Telemetry deployment skipped."
              exit 1
            fi
          EOF
