name: Deploy Frontend (Docker to GHCR)

on:
  push:
    branches:
      - main

# Permisos requeridos para escribir paquetes en el registro GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login en GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generar nombres de tag en minúsculas (requisito de Docker)
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend

      # Construcción externa de la Imagen (Segura e Inmutable)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # Ubicación del frontend en el repo
          file: ./frontend/Dockerfile.prod # Especificar Dockerfile.prod del frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-arm-us:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Conectar a la VPN para poder acceder de forma segura a la instancia ARM interna
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Notificar y desplegar en la ARM US usando SSH privado sobre la VPN
      - name: Execute Pull and Restart in ARM US
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ARM_US_TAILSCALE_IP }}" >> ~/.ssh/known_hosts
          
          ssh ${{ secrets.SSH_USER }}@${{ secrets.ARM_US_TAILSCALE_IP }} << 'EOF'
            cd /opt/bienestar
            
            # Autenticar Docker contra GHCR para descargar la imagen
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar imagen actualizada y recrear contenedor sin downtime para los otros servicios
            docker compose pull frontend
            docker compose up -d frontend
            
            # Limpiar imágenes huérfanas
            docker image prune -f
          EOF
