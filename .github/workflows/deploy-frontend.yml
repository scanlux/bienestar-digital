name: Deploy Frontend (Docker to GHCR)

on:
  push:
    branches:
      - produccion
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

# Permisos requeridos para escribir paquetes en el registro GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login en GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generar nombres de tag en minusculas (requisito de Docker)
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend

      # Construccion externa de la Imagen (Segura e Inmutable)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Contexto en la raiz para acceder a workspaces
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
