name: Deploy Backend (Docker to GHCR)

on:
  push:
    branches:
      - produccion
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Permisos requeridos para escribir paquetes en el registro GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login en GitHub Container Registry (GHCR) de forma gratuita
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generar nombres de tag en minusculas (requisito de Docker)
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend

      # Construccion externa de la Imagen (Segura e Inmutable)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Contexto en la raiz para acceder a workspaces
          file: ./backend/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-arm-us:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Conectar a la VPN para poder acceder de forma segura a la instancia ARM interna
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Preparar la llave SSH y verificar formato
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY_ARM }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -l -f ~/.ssh/id_rsa
          echo "Llave SSH configurada correctamente."

      # Registrar la huella del servidor y verificar conectividad
      - name: Verify Tailscale Connectivity
        run: |
          echo "Verificando conectividad Tailscale hacia ARM-USA..."
          ping -c 3 "${{ secrets.ARM_US_TAILSCALE_IP }}" || echo "ADVERTENCIA: ping fallo, intentando SSH de todas formas"
          ssh-keyscan -H "${{ secrets.ARM_US_TAILSCALE_IP }}" >> ~/.ssh/known_hosts 2>/dev/null && echo "Host key registrado OK" || echo "ssh-keyscan fallo"

      # Desplegar en ARM US via SSH sobre la VPN Tailscale
      - name: Execute Deploy in ARM US
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          # Escribir el token en un archivo temporal (evita fugas en logs)
          TOKEN_FILE=$(mktemp)
          printf '%s' "${DEPLOY_TOKEN}" > "${TOKEN_FILE}"

          # Copiar el archivo de token al servidor de forma segura
          scp -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -i ~/.ssh/id_rsa \
              "${TOKEN_FILE}" \
              "${{ secrets.SSH_USER }}@${{ secrets.ARM_US_TAILSCALE_IP }}:/tmp/.ghcr_token"

          # Ejecutar deploy remoto
          ssh -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              -i ~/.ssh/id_rsa \
              "${{ secrets.SSH_USER }}@${{ secrets.ARM_US_TAILSCALE_IP }}" \
              "cat /tmp/.ghcr_token | sudo docker login ghcr.io -u '${DEPLOY_ACTOR}' --password-stdin && \
               rm -f /tmp/.ghcr_token && \
               cd /opt/bienestar && \
               nohup sudo bash safe_service_update.sh backend > resultado_backend.log 2>&1 & \
               echo 'Deploy backend iniciado en background. PID: '\$!"

          # Limpiar archivo local
          rm -f "${TOKEN_FILE}"
