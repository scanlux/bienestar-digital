name: Deploy Backend (Docker to GHCR)

on:
  push:
    branches:
      - produccion
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Permisos requeridos para escribir paquetes en el registro GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login en GitHub Container Registry (GHCR) de forma gratuita
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generar nombres de tag en minúsculas (requisito de Docker)
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend

      # Construcción externa de la Imagen (Segura e Inmutable)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Contexto en la raiz para acceder a workspaces
          file: ./backend/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-arm-us:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Conectar a la VPN para poder acceder de forma segura a la instancia ARM interna
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Preparar la llave SSH y verificar conectividad antes de intentar el deploy
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY_ARM }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Verificar que la llave tiene el formato correcto
          ssh-keygen -l -f ~/.ssh/id_rsa

      - name: Test Tailscale Connectivity to ARM US
        run: |
          echo "Verificando conectividad Tailscale hacia ${{ secrets.ARM_US_TAILSCALE_IP }}..."
          ping -c 3 "${{ secrets.ARM_US_TAILSCALE_IP }}" || echo "ADVERTENCIA: ping fallo, intentando SSH de todas formas"
          ssh-keyscan -H "${{ secrets.ARM_US_TAILSCALE_IP }}" >> ~/.ssh/known_hosts 2>/dev/null && echo "ssh-keyscan OK" || echo "ssh-keyscan fallo"

      # Desplegar en ARM US via SSH sobre la VPN Tailscale
      - name: Execute Deploy in ARM US
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ARM_IP: ${{ secrets.ARM_US_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -v \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=10 \
            -o BatchMode=yes \
            -i ~/.ssh/id_rsa \
            "${SSH_USER}@${ARM_IP}" \
            "cd /opt/bienestar && \
             echo '${GITHUB_TOKEN}' | sudo docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin && \
             nohup sudo bash safe_service_update.sh backend > resultado_backend.log 2>&1 & \
             echo 'Deploy iniciado en background. PID: '\$!"
