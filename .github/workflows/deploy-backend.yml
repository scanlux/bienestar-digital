name: Deploy Backend (Docker to GHCR)

on:
  push:
    branches:
      - produccion
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Permisos requeridos para escribir paquetes en el registro GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login en GitHub Container Registry (GHCR) de forma gratuita
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generar nombres de tag en minúsculas (requisito de Docker)
      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend

      # Construcción externa de la Imagen (Segura e Inmutable)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Contexto en la raiz para acceder a workspaces
          file: ./backend/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-arm-us:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Conectar a la VPN para poder acceder de forma segura a la instancia ARM interna
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Notificar y desplegar en la ARM US usando SSH privado sobre la VPN
      - name: Execute Pull and Restart in ARM US
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_ARM }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ARM_US_TAILSCALE_IP }}" >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.SSH_USER }}@${{ secrets.ARM_US_TAILSCALE_IP }} << 'EOF'
            cd /opt/bienestar
            
            # Autenticar Docker contra GHCR para poder descargar la imagen privada (si aplica)
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Ejecutar actualización segura sin downtime y sin saturar memoria RAM (OOM prevent)
            nohup sudo bash safe_service_update.sh backend > resultado_backend.log 2>&1 &
          EOF
