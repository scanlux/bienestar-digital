user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP Server: Redirect all traffic to HTTPS, except Certbot challenge
    server {
        listen 80;
        server_name telemetry.trendy.sytes.net trendy-telemetry.sytes.net;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: SSL termination and proxy to telemetry microservice
    server {
        listen 443 ssl http2;
        server_name telemetry.trendy.sytes.net trendy-telemetry.sytes.net;

        # SSL certificate paths (mounted from Host Let's Encrypt directory)
        ssl_certificate /etc/letsencrypt/live/trendy-telemetry.sytes.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trendy-telemetry.sytes.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://telemetry:4001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket long-lived connections timeouts (24 hours)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
