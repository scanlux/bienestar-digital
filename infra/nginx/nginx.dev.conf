server {
    listen 80;
    server_name localhost;

    # Frontend Proxy (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend Proxy (Node.js API)
    location /api {
        # Reescribimos /api para que el backend reciba la ruta limpia si es necesario,
        # o lo dejamos tal cual si el backend maneja el prefijo /api.
        # En este caso, asumiremos que el backend maneja sus rutas.
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
