services:
  nginx:
    image: nginx:alpine
    container_name: bienestar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    image: ghcr.io/scanlux/bienestar-digital-frontend:produccion
    container_name: bienestar-frontend
    expose:
      - "3000"    # Solo visible dentro de la red interna de Docker para Nginx
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=450
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
