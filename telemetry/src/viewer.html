<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Dataset NLP - KeyboardAndroid</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #1e293b;
      padding: 14px 20px;
      border-radius: 10px;
      margin-bottom: 24px;
      border: 1px solid #334155;
      flex-wrap: wrap;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
      color: #f1f5f9;
      font-weight: 600;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3b82f6;
    }
    .badge {
      background: #0284c7;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .search-input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      flex: 1;
      min-width: 200px;
      outline: none;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }

    #dataset-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .entry-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px 18px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.88rem;
      transition: border-color 0.2s;
    }
    .entry-card:hover {
      border-color: #475569;
    }
    .entry-card.formatted {
      white-space: pre-wrap;
      word-break: break-word;
      color: #34d399;
    }
    .entry-card.raw {
      white-space: nowrap;
      overflow-x: auto;
      color: #e2e8f0;
    }
    pre {
      margin: 0;
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #34d399;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="pageTitle">📊 Visor de Dataset NLP</h1>
        <div class="subtitle" id="fileSubtitle">Cargando datos...</div>
      </div>
      <div>
        <a href="./" class="btn btn-secondary">📁 Ver Archivos</a>
        <a id="rawDownloadBtn" href="#" download class="btn">⬇ Descargar Original</a>
      </div>
    </div>

    <div class="controls">
      <label class="checkbox-label">
        <input type="checkbox" id="formatCheck" checked />
        Dar formato al texto (JSON Identado)
      </label>

      <input type="text" id="searchInput" placeholder="Filtrar por texto, app_contexto o fecha..." class="search-input" />

      <span class="badge" id="recordCount">Total registros: 0</span>
    </div>

    <div id="dataset-container">
      <div class="loading">Cargando y procesando archivo JSON...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetFile = params.get('file') || 'dataset_lenguaje_humano.json';
    
    document.getElementById('fileSubtitle').textContent = 'Archivo: ' + targetFile;
    document.getElementById('rawDownloadBtn').href = targetFile;

    let rawItems = [];
    const checkbox = document.getElementById('formatCheck');
    const searchInput = document.getElementById('searchInput');
    const container = document.getElementById('dataset-container');
    const recordCount = document.getElementById('recordCount');

    function render() {
      const isFormatted = checkbox.checked;
      const query = searchInput.value.toLowerCase().trim();

      const filtered = rawItems.filter(item => {
        if (!query) return true;
        const str = typeof item === 'string' ? item : JSON.stringify(item);
        return str.toLowerCase().includes(query);
      });

      recordCount.textContent = 'Total registros: ' + filtered.length + (filtered.length !== rawItems.length ? ' (de ' + rawItems.length + ')' : '');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; padding:30px; text-align:center; background:#1e293b; border-radius:8px;">No se encontraron registros.</div>';
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'entry-card ' + (isFormatted ? 'formatted' : 'raw');

        if (isFormatted) {
          const pre = document.createElement('pre');
          pre.textContent = typeof item === 'object' ? JSON.stringify(item, null, 2) : item;
          card.appendChild(pre);
        } else {
          card.textContent = typeof item === 'object' ? JSON.stringify(item) : item;
        }

        container.appendChild(card);
      });
    }

    checkbox.addEventListener('change', render);
    searchInput.addEventListener('input', render);

    // Fetch and parse the JSONL file
    fetch(targetFile)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        return res.text();
      })
      .then(text => {
        const lines = text.split('\n').filter(l => l.trim());
        rawItems = lines.map(l => {
          try {
            return JSON.parse(l);
          } catch(e) {
            return { raw_text: l };
          }
        });
        document.getElementById('pageTitle').textContent = '📊 Dataset NLP (' + rawItems.length + ' muestras)';
        render();
      })
      .catch(err => {
        container.innerHTML = '<div style="color:#f87171; padding:30px; text-align:center; background:#1e293b; border-radius:8px;">Error al cargar el archivo: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
